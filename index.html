<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav>
        <h2 class="logo">TechNova</h2>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
</header>

<section class="hero">

    <div class="overlay">

        <h1>Welcome to TechNova</h1>

        <p>Design. Develop. Innovate.</p>

        <button>Get Started</button>
        <button class="btn2">Learn More</button>

    </div>

</section>

<section id="about">

    <h2>About Us</h2>

    <p>
        TechNova is a modern web development company that creates
        responsive and attractive websites using HTML, CSS and JavaScript.
    </p>

</section>

<section id="contact">

<h2>Contact Us</h2>

<form>

<input type="text" placeholder="Your Name" required>

<input type="email" placeholder="Your Email" required>

<textarea rows="5" placeholder="Your Message"></textarea>

<button type="submit">Send Message</button>

</form>

</section>

<footer>

<p>© 2026 TechNova. All Rights Reserved.</p>

</footer>

</body>
</html>
